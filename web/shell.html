<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conquer.io</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: sans-serif; overflow: hidden; }
  #wrap { display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; outline: none; }
  #status { position: fixed; top: 50%; left: 0; right: 0; text-align: center; transform: translateY(-50%); }
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="status">Cargando…</div>
<script>
  // Comprobación previa: el juego necesita WebGL (usa un canvas temporal para no
  // fijar los atributos del contexto del canvas real)
  (function () {
    var ok = false;
    try {
      var t = document.createElement('canvas');
      ok = !!(t.getContext('webgl2') || t.getContext('webgl') || t.getContext('experimental-webgl'));
    } catch (e) {}
    if (!ok) {
      window.__noWebGL = true;
      var st = document.getElementById('status') || document.body;
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('status').innerHTML =
          'Tu navegador no puede crear un contexto WebGL.<br>Activa la aceleración por hardware o prueba con otro navegador.';
      });
    }
  })();
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (t) { if (window.__noWebGL) return; document.getElementById('status').textContent = t; if (!t) document.getElementById('status').style.display = 'none'; },
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); }
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
