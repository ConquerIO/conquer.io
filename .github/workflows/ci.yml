name: CI

# Compila el juego en cada push/PR para detectar errores de build.
# Raylib va versionada en vendor/lib, asi que no hay que construirla ni cachearla.
# No ejecuta el juego: los runners no tienen pantalla y InitWindow fallaria.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgl1-mesa-dev \
            xorg-dev \
            libasound2-dev \
            libspdlog-dev

      - name: Compilar el juego
        run: make

      - name: Comprobar warnings (informativo)
        continue-on-error: true
        run: |
          g++ -fsyntax-only -Wall -Wextra src/*.cpp -I src/ -I vendor/include/

      - name: Verificar binario
        run: test -x game

  web:
    name: Compilar (Web / Emscripten)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Compilar la versión web
        run: make web

      - name: Verificar artefactos
        run: |
          test -f build-web/index.html
          test -f build-web/index.js
          test -f build-web/index.wasm
          test -f build-web/index.data
